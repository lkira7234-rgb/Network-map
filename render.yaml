services:
  - type: web
    name: network-map
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && (npm run preview:install || echo "preview browser skipped")
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # Do not set NODE_ENV=production here: it makes npm skip devDependencies
      # (vite/typescript) during the build step. Render sets it at runtime.
      # Render terminates TLS in front of the service.
      - key: TRUST_PROXY
        value: "1"
      # Render routes traffic to the container, so it must listen on all interfaces.
      - key: HOST
        value: 0.0.0.0
      # Abuse protection: 3 scans per minute per IP, 4 concurrent scans globally.
      - key: SCAN_LIMIT
        value: "3"
      - key: SCAN_WINDOW_MS
        value: "60000"
      - key: DEMO_LIMIT
        value: "10"
      - key: MAX_ACTIVE_SCANS
        value: "4"
      # Optional perimeter monitor. Uncomment and fill in to enable server-side
      # scheduled scans and webhook alerts (see docs/MONITORING.md).
      # - key: MONITOR_TARGETS
      #   value: example.com
      # - key: MONITOR_PORTS
      #   value: "22,80,443,6379"
      # - key: MONITOR_INTERVAL_MIN
      #   value: "60"
      # Alerts about every scan started in the UI are on by default; set to "0"
      # to disable them. NOTIFY_FIRST_SCAN=1 also announces the first scan.
      # - key: NOTIFY_SCANS
      #   value: "1"
      # - key: NOTIFY_FIRST_SCAN
      #   value: "1"
      # Telegram bot: visitors can add sites in private messages. Enabled when
      # ALERT_TELEGRAM_TOKEN is set; BOT_ENABLED=0 disables it.
      # - key: BOT_ENABLED
      #   value: "1"
      # - key: BOT_MAX_PER_CHAT
      #   value: "5"
      # - key: ALERT_WEBHOOK_URL
      #   sync: false
      # - key: ALERT_TELEGRAM_TOKEN
      #   sync: false
      # - key: ALERT_TELEGRAM_CHAT
      #   sync: false
      # Operator token for admin monitor endpoints (full status, test, run).
      # Without it they answer 404; the public status stays available.
      # - key: MONITOR_TOKEN
      #   sync: false
      # Persistent history. Mount a Render Disk at /var/data and point DATA_DIR
      # there; otherwise SQLite lives only until the next redeploy.
      # - key: DATA_DIR
      #   value: /var/data
      # AbuseIPDB reputation (optional). Cached for 24 hours.
      # - key: ABUSEIPDB_API_KEY
      #   sync: false
      # - key: ABUSEIPDB_MAX_AGE_DAYS
      #   value: "90"
      # Screenshots of web ports. The build installs headless Chromium into
      # .chrome/; set PREVIEW_ENABLED=0 to skip, or CHROME_PATH for your own.
      # - key: PREVIEW_ENABLED
      #   value: "1"
      # - key: CHROME_PATH
      #   value: /usr/bin/chromium
      # Trash Mode limits.
      # - key: GARBAGE_LIMIT
      #   value: "12"
      # - key: MAX_ACTIVE_PICKS
      #   value: "3"