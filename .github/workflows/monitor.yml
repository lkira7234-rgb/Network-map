name: perimeter-monitor

# Wakes the Render service and runs one monitor pass. Without these secrets the
# job is a no-op, so a fork does not spam anybody. Set MONITOR_URL and
# MONITOR_TOKEN in Settings → Secrets and variables → Actions.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          if [ -z "$MONITOR_TOKEN" ] || [ -z "$MONITOR_URL" ]; then
            echo "MONITOR_URL / MONITOR_TOKEN secrets are not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "${MONITOR_URL%/}/api/monitor/run" \
            -H "X-Monitor-Token: $MONITOR_TOKEN"
